server {
    listen 443 ssl http2;
    server_name gateway.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/gateway.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.yourdomain.com/privkey.pem;

    # Gateway 监听 127.0.0.1:8788，不对外暴露
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Public-Token $http_x_public_token;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # 可选：/admin/ 仅允许运维 IP 访问，增加一层网络隔离
    # location /admin/ {
    #     allow 你的管理IP;
    #     deny all;
    #     ...
    # }
}

server {
    listen 80;
    server_name gateway.yourdomain.com;
    return 301 https://$server_name$request_uri;
}
