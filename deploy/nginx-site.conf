# Agent Hub Nginx site config
# 用法：
#   1. 把 hub.example.com 换成你的域名（DNS 需先解析到本 VPS）
#   2. 复制到 /etc/nginx/sites-available/agent-hub
#   3. ln -s 到 /etc/nginx/sites-enabled/
#   4. certbot certonly --nginx -d hub.example.com --deploy-hook "systemctl reload nginx"  申请证书
#   5. nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name hub.example.com;

    # certbot 验证路径（nginx 插件也会自动处理，保留此处更稳妥）
    location /.well-known/acme-challenge/ {
        default_type "text/plain";
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hub.example.com;

    # certbot 申请后默认路径；若证书位置不同请修改
    ssl_certificate     /etc/letsencrypt/live/hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.com/privkey.pem;

    # TLS 建议
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        # SSH 反向隧道把 VPS 的 127.0.0.1:8787 连到家里 PC 的 Hub
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # WebSocket 升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接保持，避免 WS 空闲被断开
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
